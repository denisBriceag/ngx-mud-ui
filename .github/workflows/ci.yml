name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dev tooling included: Storybook and the build tools run on developers' machines.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # Angular's build cache (angular.json cli.cache.environment = all, else it is off under CI=true)
      # and ESLint's cache (content strategy: checkout resets mtimes). Both validate their own entries,
      # so restoring a previous run's cache via restore-keys is safe.
      - name: Restore build + lint caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .angular
          key: angular-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Tool tests (icons, prebuilt CSS, style guard)
        run: pnpm test:tools

      - name: Schematic tests (ng add)
        run: pnpm test:schematics

      - name: Build library
        run: pnpm build

      - name: Style guard (layering + tokens; reads the built mud.css)
        run: pnpm styles:check

      - name: Build Storybook
        run: pnpm build-storybook
