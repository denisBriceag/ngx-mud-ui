name: Publish

# Publishing a GitHub release (tag `v<version>`) publishes that version to npm.
# Uses npm trusted publishing: npm verifies this workflow through GitHub's OIDC token, so no npm
# token is stored anywhere, and the package gets a provenance attestation linking it to this commit.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./projects/ngx-mud-ui/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Schematic tests (ng add)
        run: pnpm test:schematics

      - name: Build library
        run: pnpm build

      - name: Style guard
        run: pnpm styles:check

      - name: Publish
        working-directory: dist/ngx-mud-ui
        run: npm publish --provenance --access public
