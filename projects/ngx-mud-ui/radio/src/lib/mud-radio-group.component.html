@if (_hasLabel()) {
  <div class="radio-group__label" [id]="_labelId">
    <ng-content select="mud-label" />
    @if (required()) {
      <span class="radio-group__required" aria-hidden="true">*</span>
    }
  </div>
}

<ng-content />

@if (_hasMessages()) {
  <div class="radio-group__assistive" role="alert" [id]="_assistiveId">
    <ng-content select="mud-inline-message" />
  </div>
}
