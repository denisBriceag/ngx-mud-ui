<div class="selection-control__row">
  <span class="selection-control__box">
    <input
      #native
      type="radio"
      class="selection-control__native"
      [id]="_id"
      [checked]="_checked()"
      [disabled]="_effectiveDisabled()"
      [required]="_required()"
      [attr.name]="_name()"
      [attr.aria-label]="_ariaLabel()"
      [attr.aria-describedby]="_describedBy()"
      (click)="_onClick($event)"
      (keydown)="_onKeydown($event)"
      (change)="_onNativeChange($event)"
    />
    <span class="selection-control__dot"></span>
  </span>

  <span class="selection-control__text">
    @if (_hasLabel()) {
      <label class="selection-control__label" [attr.for]="_id">
        <ng-content select="mud-label" />
      </label>
    }
    @if (_hasMessages()) {
      <div class="selection-control__assistive" [id]="_assistiveId">
        <ng-content select="mud-inline-message" />
      </div>
    }
  </span>
</div>
