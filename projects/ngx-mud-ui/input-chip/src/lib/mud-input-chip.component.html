@if (_hasLabel()) {
  <label class="input-field__label" [attr.for]="_id" [id]="_labelId">
    <span class="input-field__label-text"><ng-content select="mud-label" /></span>
    @if (required()) {
      <span class="input-field__required" aria-hidden="true">*</span>
    }
  </label>
}

<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
<div
  class="input-field__control chip-field__control"
  role="group"
  [attr.aria-label]="_ariaLabel()"
  [attr.aria-labelledby]="_hasLabel() ? _labelId : null"
  (click)="_onControlClick($event)"
>
  @for (chip of value(); track $index) {
    <span class="chip-field__chip">
      <span class="chip-field__chip-label">{{ chip }}</span>
      <button
        #removeBtn
        type="button"
        class="chip-field__chip-remove"
        [attr.data-chip-index]="$index"
        [attr.aria-label]="_removeName()(chip)"
        [disabled]="_effectiveDisabled()"
        (click)="_onRemoveClick($event, $index)"
        (keydown)="_onChipKeydown($event, $index)"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" focusable="false" aria-hidden="true">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M4.41 4.41a.833.833 0 0 1 1.18 0L10 8.821l4.41-4.41a.833.833 0 1 1 1.18 1.178L11.178 10l4.41 4.41a.833.833 0 0 1-1.178 1.18L10 11.178l-4.41 4.41a.833.833 0 0 1-1.18-1.178L8.821 10l-4.41-4.41a.833.833 0 0 1 0-1.18"
          />
        </svg>
      </button>
    </span>
  }

  <input
    #native
    type="text"
    class="input-field__native chip-field__native"
    [id]="_id"
    [value]="draft()"
    [attr.name]="name() || null"
    [attr.placeholder]="value().length === 0 ? (placeholder() ?? null) : null"
    [disabled]="_effectiveDisabled()"
    [readOnly]="_effectiveReadonly()"
    [required]="required()"
    autocomplete="off"
    [attr.aria-label]="_ariaLabel()"
    [attr.aria-describedby]="_describedBy()"
    [attr.aria-invalid]="_effectiveInvalid() ? 'true' : null"
    (input)="_onDraftInput($event)"
    (keydown)="_onInputKeydown($event)"
    (paste)="_onPaste($event)"
    (focus)="_onFocus()"
    (blur)="_onBlur()"
  />
</div>

@if (_hasMessages()) {
  <!-- Field-owned role=alert wrapper announces on insertion (WCAG 4.1.3). -->
  <div class="input-field__assistive" role="alert" [id]="_assistiveId">
    <ng-content select="mud-inline-message" />
  </div>
}

<span class="input-field__sr-only" role="status" aria-live="polite">{{ _announcement() }}</span>
